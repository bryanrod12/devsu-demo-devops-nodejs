name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/devsu-demo-devops-nodejs

jobs:
  test:
    name: Build, lint, tests y cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci                    # Code build (instalar dependencias)
      - run: npm run lint              # Analisis estatico
      - run: npm run test:coverage     # Unit tests + cobertura
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage

  docker:
    name: Docker build, escaneo y push
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (local) para escanear
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
      - name: Vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL
          exit-code: "0"     # informativo; cambiar a 1 para bloquear el pipeline
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    name: Deploy a Kubernetes (minikube)
    needs: docker
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: medyagh/setup-minikube@latest
      - name: Aplicar manifiestos
        run: |
          sed -i "s|ghcr.io/TU_USUARIO/|ghcr.io/${{ github.repository_owner }}/|" k8s/deployment.yaml
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/
          kubectl -n devsu-demo rollout status deployment/demo-app --timeout=180s
          kubectl -n devsu-demo get pods,svc
